<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mia教务管理工作台</title>
<meta name="theme-color" content="#3D3151">
<style>
:root{
--primary:#8B7CB3;--primary-dark:#6B5B8F;--primary-light:#EDE8F5;--primary-bg:#F5F2FA;
--bg-page:#F0EBF5;--bg-card:#fff;--bg-input:#F7F5FA;
--text-primary:#3D3151;--text-secondary:#8A7FA0;--text-tertiary:#B8AEC9;
--success:#86C9A0;--warning:#E8B87D;--danger:#E8929C;--info:#9AAAD8;
--border-light:#EDE8F2;--border-normal:#E0D8EA;--border-input:#E0D8EA;
--shadow-card:0 2px 8px rgba(61,49,81,.06);--shadow-sidebar:4px 0 24px rgba(61,49,81,.1);--shadow-modal:0 8px 32px rgba(61,49,81,.14);
--radius-sm:8px;--radius-md:14px;--radius-lg:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg-page);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;color:var(--text-primary)}
input,textarea,select,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh}
.header{height:56px;background:linear-gradient(135deg,#3D3151,#5A4A75);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(61,49,81,.2);z-index:100}
.header-title{font-size:17px;font-weight:600;letter-spacing:.5px}
.header-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.header-right{display:flex;align-items:center;gap:12px}
.header-icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;font-size:16px;transition:background .2s}
.header-icon-btn:active{background:rgba(255,255,255,.25)}

.main-area{flex:1;height:calc(100vh - 56px);overflow:hidden;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.content-inner{max-width:1000px;margin:0 auto}

/* Drawer Sidebar */
.sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#fff;z-index:200;transform:translateX(-100%);transition:transform .3s ease;box-shadow:4px 0 24px rgba(61,49,81,.15);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar-logo{padding:20px 20px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid var(--border-light)}
.sidebar-logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(107,91,143,.3)}
.sidebar-logo-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sidebar-logo-title{font-size:17px;font-weight:700;color:var(--text-primary);white-space:nowrap}
.sidebar-logo-sub{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.sidebar-nav{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px}
.sidebar-group-title{font-size:11px;color:var(--text-tertiary);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:14px 12px 6px}
.sidebar-group-title:first-child{padding-top:6px}
.sidebar-item{width:100%;height:46px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 12px;gap:12px;color:var(--text-primary);font-size:16px;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s}
.sidebar-item .nav-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.sidebar-item .nav-label{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-item:active{background:var(--primary-bg)}
.sidebar-item.active{background:var(--primary-light);color:var(--primary-dark)}
.sidebar-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
.sidebar-footer-info{display:flex;flex-direction:column;gap:4px}
.sidebar-footer-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-tertiary)}
.sidebar-footer-row .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}

/* Cards */
.card{background:var(--bg-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card);border:1px solid var(--border-light);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-section{margin-bottom:16px}
.card-section:last-child{margin-bottom:0}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card);border:1px solid var(--border-light);padding:16px;display:flex;flex-direction:column;gap:4px}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.stat-value{font-size:24px;font-weight:700;color:var(--text-primary)}
.stat-label{font-size:12px;color:var(--text-secondary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .2s;border:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 2px 6px rgba(107,91,143,.3)}
.btn-primary:active{transform:scale(.97);box-shadow:0 1px 3px rgba(107,91,143,.3)}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border-normal);color:var(--text-secondary)}
.btn-outline:active{background:var(--primary-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:16px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.form-label .req{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--border-input);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:14px;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row>.form-group{flex:1}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border-light);background:var(--primary-bg);white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border-light);color:var(--text-primary)}
.data-table tr:active{background:var(--primary-bg)}
.data-table tr:last-child td{border-bottom:none}

/* List */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border-light);gap:8px}
.list-item:last-child{border-bottom:none}
.list-item-info{flex:1;min-width:0}
.list-item-title{font-size:14px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-actions{display:flex;gap:6px;flex-shrink:0}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-primary{background:var(--primary-light);color:var(--primary-dark)}
.badge-success{background:rgba(134,201,160,.15);color:var(--success)}
.badge-warning{background:rgba(232,184,125,.15);color:var(--warning)}
.badge-danger{background:rgba(232,146,156,.15);color:var(--danger)}
.badge-info{background:rgba(154,170,216,.15);color:var(--info)}

/* 历史考勤记录 */
.hist-chip{display:inline-flex;align-items:center;padding:5px 12px;margin:0 6px 6px 0;border-radius:14px;font-size:12px;color:var(--text-secondary);background:var(--primary-bg);border:none;cursor:pointer;transition:all .2s}
.hist-chip.active{background:var(--primary-dark);color:#fff}
.hist-stats{display:flex;gap:8px;margin-bottom:2px}
.hist-stat{flex:1;background:var(--primary-bg);border-radius:10px;padding:10px 8px;text-align:center}
.hist-stat-num{font-size:20px;font-weight:700;color:var(--primary-dark);line-height:1.2}
.hist-stat-label{font-size:11px;color:var(--text-secondary);margin-top:2px}
.hist-class-title{font-size:13px;font-weight:600;color:var(--primary-dark);padding:10px 0 4px;margin-top:6px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(61,49,81,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.modal-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-tertiary);transition:all .2s}
.modal-close:active{background:var(--primary-bg)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* Empty State */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-tertiary)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state-text{font-size:14px}

/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--primary-bg);border-radius:var(--radius-sm);margin-bottom:16px}
.tab{flex:1;padding:8px 12px;text-align:center;font-size:13px;font-weight:500;color:var(--text-secondary);border-radius:6px;transition:all .2s;cursor:pointer}
.tab.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(61,49,81,.08)}

/* Search & Filter */
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar .form-input{flex:1}

/* File Upload */
.upload-area{border:2px dashed var(--border-normal);border-radius:var(--radius-sm);padding:20px;text-align:center;transition:all .2s;cursor:pointer;background:var(--bg-input)}
.upload-area:active{border-color:var(--primary);background:var(--primary-light)}
.upload-icon{font-size:28px;color:var(--text-tertiary);margin-bottom:8px}
.upload-text{font-size:13px;color:var(--text-secondary)}
.upload-hint{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.file-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.image-thumb{width:60px;height:60px;border-radius:var(--radius-sm);object-fit:cover;border:1px solid var(--border-light)}
.file-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--primary-light);border-radius:6px;font-size:12px;color:var(--primary-dark)}
.file-tag .remove{cursor:pointer;font-weight:bold;opacity:.6}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(61,49,81,.9);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;z-index:9999;animation:toastIn .3s ease;backdrop-filter:blur(4px);max-width:90%;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Detail Page */
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border-light);font-size:18px;color:var(--text-secondary);flex-shrink:0;box-shadow:var(--shadow-card)}
.back-btn:active{background:var(--primary-bg)}
.detail-title{font-size:20px;font-weight:700;color:var(--text-primary)}
.detail-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}

/* Avatar */
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;flex-shrink:0}
.avatar-sm{width:32px;height:32px;font-size:13px}
.avatar-lg{width:56px;height:56px;font-size:22px}

/* Progress */
.progress-bar{width:100%;height:6px;background:var(--primary-bg);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:3px;transition:width .3s}

/* Switch */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.switch-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border-normal);border-radius:12px;transition:.3s}
.switch-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.switch-slider{background:var(--primary)}
.switch input:checked+.switch-slider:before{transform:translateX(20px)}

/* Checkbox */
.check-item{display:flex;align-items:center;gap:8px;padding:8px 0}
.checkbox{width:18px;height:18px;border:2px solid var(--border-normal);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.checkbox.checked{background:var(--primary);border-color:var(--primary)}
.checkbox.checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* Points/Score display */
.points-display{font-size:28px;font-weight:700;color:var(--warning)}

/* Reward card */
.reward-card{display:flex;flex-direction:column;align-items:center;padding:16px;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border-light);box-shadow:var(--shadow-card);text-align:center}
.reward-icon{font-size:32px;margin-bottom:8px}
.reward-name{font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.reward-cost{font-size:13px;color:var(--warning);font-weight:600;margin-bottom:8px}

/* Loading */
.loading{text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-normal);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<style>
#eduGate{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e8edfb 0%,#f6f8fc 100%);font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
#eduGate *{box-sizing:border-box}
#eduGate .gate-card{width:min(92vw,380px);background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(30,50,120,.14);padding:36px 28px 26px;text-align:center}
#eduGate .gate-badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:1px;color:#4f6ef7;background:#eef1fe;border:1px solid #dde4fc;border-radius:999px;padding:4px 14px;margin-bottom:18px}
#eduGate .gate-title{font-size:20px;font-weight:700;color:#1f2430;margin:0 0 6px}
#eduGate .gate-sub{font-size:13px;color:#8a92a6;margin:0 0 24px}
#eduGate .gate-input{width:100%;height:48px;border:1.5px solid #d8deee;border-radius:12px;padding:0 16px;font-size:16px;color:#1f2430;outline:none;background:#fbfcff;transition:border-color .2s}
#eduGate .gate-input:focus{border-color:#4f6ef7;background:#fff}
#eduGate .gate-btn{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#4f6ef7,#6a5af9);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;transition:opacity .2s}
#eduGate .gate-btn:disabled{opacity:.55;cursor:default}
#eduGate .gate-btn:active:not(:disabled){opacity:.85}
#eduGate .gate-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;color:#8a92a6}
#eduGate .gate-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
#eduGate .gate-err{display:none;color:#e34d4d;font-size:13px;margin-top:12px}
#eduGate .gate-foot{font-size:11px;color:#b3bac9;margin-top:20px}
</style>
<div id="eduGate">
  <div class="gate-card">
    <div class="gate-badge">MIA EDU WORKBENCH</div>
    <h2 class="gate-title">请输入访问密码</h2>
    <p class="gate-sub">此工作台仅限授权教师使用</p>
    <input id="eduPass" class="gate-input" type="password" placeholder="访问密码" autocomplete="off" autocapitalize="off">
    <button id="eduBtn" class="gate-btn" type="button">进入工作台</button>
    <div class="gate-row">
      <label><input id="eduRem" type="checkbox" checked> 7 天内免登录</label>
      <span>忘记密码请联系管理员</span>
    </div>
    <div id="eduErr" class="gate-err">密码错误，请重新输入</div>
    <div class="gate-foot">Mia 教务工作台 · 访问受保护</div>
  </div>
</div>
<script>
(function(){
  var HASH='9fdcf011b99bd99d6fb3793987d69ef28127e1e1adad2de8627648a88dc26e62';
  var DAYS=7, KEY='miaedu_gate';
  function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return (b<16?'0':'')+b.toString(16)}).join('')}
  function hashPwd(p){
    if(!window.crypto||!window.crypto.subtle)return Promise.reject('no-crypto');
    return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)).then(toHex);
  }
  function validToken(t){
    if(!t)return false;
    var i=t.indexOf('.');
    if(i<0)return false;
    return t.slice(0,i)===HASH.slice(0,24)&&(Date.now()-Number(t.slice(i+1)))<DAYS*864e5;
  }
  try{
    var saved=localStorage.getItem(KEY);
    if(validToken(saved)){unlock();return}
  }catch(e){}
  function unlock(){
    var g=document.getElementById('eduGate');
    if(g&&g.parentNode)g.parentNode.removeChild(g);
  }
  var input=document.getElementById('eduPass');
  var btn=document.getElementById('eduBtn');
  var err=document.getElementById('eduErr');
  var rem=document.getElementById('eduRem');
  function submit(){
    if(btn.disabled)return;
    var p=input.value;
    if(!p){input.focus();return}
    err.style.display='none';
    btn.disabled=true;
    hashPwd(p).then(function(h){
      if(h===HASH){
        try{
          if(rem.checked){localStorage.setItem(KEY,HASH.slice(0,24)+'.'+Date.now())}
        }catch(e){}
        unlock();
      }else{
        btn.disabled=false;
        err.style.display='block';
        input.value='';
        input.focus();
      }
    }).catch(function(){
      btn.disabled=false;
      err.textContent='当前环境不支持加密校验，请使用 https 方式打开';
      err.style.display='block';
    });
  }
  btn.addEventListener('click',submit);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
  setTimeout(function(){input.focus()},120);
})();
</script>
<div id="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="header-icon-btn" data-action="toggle-sidebar" title="菜单">☰</button>
      <div>
        <div class="header-title">Mia教务工作台</div>
        <div class="header-sub" id="headerSub">首页概览</div>
      </div>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" data-action="go-settings" title="设置">⚙</button>

/* ==================== IndexedDB 数据层 ==================== */
const DB_NAME='mia_edu_workbench';
const DB_VERSION=3;
let _db=null;

const STORE_DEFS={
  students:{keyPath:'id',indexes:[{name:'name'},{name:'classId'},{name:'phone'}]},
  classes:{keyPath:'id',indexes:[{name:'name'},{name:'teacher'}]},
  parent_communications:{keyPath:'id',indexes:[{name:'studentId'},{name:'date'}]},
  study_records:{keyPath:'id',indexes:[{name:'studentId'},{name:'classId'},{name:'date'}]},
  error_analysis:{keyPath:'id',indexes:[{name:'studentId'},{name:'subject'},{name:'date'}]},
  targeted_training:{keyPath:'id',indexes:[{name:'studentId'},{name:'errorId'}]},
  study_plans:{keyPath:'id',indexes:[{name:'studentId'},{name:'status'},{name:'deadline'}]},
  assessments:{keyPath:'id',indexes:[{name:'title'},{name:'createdAt'}]},
  assessment_results:{keyPath:'id',indexes:[{name:'assessmentId'},{name:'studentId'}]},
  homework:{keyPath:'id',indexes:[{name:'classId'},{name:'createdAt'},{name:'status'}]},
  homework_records:{keyPath:'id',indexes:[{name:'homeworkId'},{name:'studentId'},{name:'status'}]},
  attendance:{keyPath:'id',indexes:[{name:'classId'},{name:'studentId'},{name:'date'},{name:'type'}]},
  points_records:{keyPath:'id',indexes:[{name:'studentId'},{name:'type'},{name:'date'}]},
  rewards:{keyPath:'id',indexes:[{name:'name'},{name:'active'}]},
  exchange_records:{keyPath:'id',indexes:[{name:'studentId'},{name:'rewardId'},{name:'date'}]},
  fees:{keyPath:'id',indexes:[{name:'name'},{name:'classId'},{name:'dueDate'}]},
  payment_records:{keyPath:'id',indexes:[{name:'feeId'},{name:'studentId'},{name:'status'}]}
};

function openDB(){
  return new Promise((resolve,reject)=>{
    if(_db)return resolve(_db);
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      for(const [storeName,config] of Object.entries(STORE_DEFS)){
        let store;
        if(!db.objectStoreNames.contains(storeName)){
          store=db.createObjectStore(storeName,{keyPath:config.keyPath});
        }else{
          store=e.target.transaction.objectStore(storeName);
        }
        if(config.indexes){
          config.indexes.forEach(idx=>{
            if(!store.indexNames.contains(idx.name)){
              store.createIndex(idx.name,idx.name,{unique:false});
            }
          });
        }
      }
    };
    req.onsuccess=e=>{_db=e.target.result;resolve(_db)};
    req.onerror=e=>reject(e.target.error);
  });
}

async function dbOp(storeName,mode,fn){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,mode);
    const store=tx.objectStore(storeName);
    const result=fn(store);
    tx.oncomplete=()=>resolve(result instanceof IDBRequest?result.result:result);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}

async function dbAdd(storeName,data){return dbOp(storeName,'readwrite',s=>s.add(data))}
async function dbGet(storeName,id){return dbOp(storeName,'readonly',s=>s.get(id))}
async function dbGetAll(storeName){return dbOp(storeName,'readonly',s=>s.getAll())}
async function dbPut(storeName,data){return dbOp(storeName,'readwrite',s=>s.put(data))}
async function dbDel(storeName,id){return dbOp(storeName,'readwrite',s=>s.delete(id))}
async function dbCount(storeName){return dbOp(storeName,'readonly',s=>s.count())}

async function dbQuery(storeName,indexName,value){
  const db=await openDB();
  return new Promise((resolve)=>{
    const tx=db.transaction(storeName,'readonly');
    const store=tx.objectStore(storeName);
    try{
      const idx=indexName?store.index(indexName):store;
      const req=idx.getAll(value);
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>{
        // Index not found - fallback to full scan
        const allReq=store.getAll();
        allReq.onsuccess=()=>{
          const results=(allReq.result||[]).filter(r=>indexName?r[indexName]===value:true);
          resolve(results);
        };
        allReq.onerror=()=>resolve([]);
      };
    }catch(e){
      // Index doesn't exist - fallback to full scan
      const allReq=store.getAll();
      allReq.onsuccess=()=>{
        const results=(allReq.result||[]).filter(r=>indexName?r[indexName]===value:true);
        resolve(results);
      };
      allReq.onerror=()=>resolve([]);
    }
  });
}

function fmtDate(d){
  if(!d)return '';
  const dt=new Date(d);
  if(isNaN(dt))return d;
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,'0');
  const day=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtDateTime(d){
  if(!d)return '';
  const dt=new Date(d);
  if(isNaN(dt))return d;
  return fmtDate(d)+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
}

function avatarColor(name){
  const colors=['#8B7CB3','#86C9A0','#E8B87D','#E8929C','#9AAAD8','#6B5B8F','#D4A5C5','#7BA8C4'];
  let hash=0;
  for(let i=0;i<name.length;i++)hash=name.charCodeAt(i)+((hash<<5)-hash);
  return colors[Math.abs(hash)%colors.length];
}

function getInitials(name){

function escapeHtml(str){
  if(str==null)return '';
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==================== 文件上传 ==================== */
function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function compressImage(file,maxWidth=800,maxHeight=800,quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxWidth){h=h*maxWidth/w;w=maxWidth}
        if(h>maxHeight){w=w*maxHeight/h;h=maxHeight}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageUpload(inputEl){
  const files=inputEl.files;
  if(!files||!files.length)return [];
  const images=[];
  for(const file of files){
    if(!file.type.startsWith('image/'))continue;
    const compressed=await compressImage(file);
    images.push({name:file.name,data:compressed,type:file.type,size:file.size});
  }
  return images;
}

async function handleFileUpload(inputEl){
  const files=inputEl.files;
  if(!files||!files.length)return {images:[],documents:[]};
  const images=[],documents=[];
  for(const file of files){
    if(file.type.startsWith('image/')){
      const compressed=await compressImage(file);
      images.push({name:file.name,data:compressed,type:file.type,size:file.size});
    }else{
      const base64=await readFileAsBase64(file);
      documents.push({name:file.name,type:file.type,size:file.size,data:base64});
    }
  }
  return {images,documents};
}

let _tempImages={};

function setupImagePreview(inputId,previewId){
  const input=document.getElementById(inputId);

function setupFilePreview(inputId,previewId){

  if(!input)return;
  input.addEventListener('change',async()=>{

    if(!preview)return;
    const key=inputId;

    renderFilePreview(previewId,key);

function renderImagePreview(previewId,key){
  const preview=document.getElementById(previewId);

function renderFilePreview(previewId,key){
  const preview=document.getElementById(previewId);

  const docs=_tempDocuments[key]||[];
  preview.innerHTML=docs.map((doc,i)=>

function removeTempImage(key,index,previewId){
  if(_tempImages[key])_tempImages[key].splice(index,1);
  renderImagePreview(previewId,key);
}

function removeTempDocument(key,index,previewId){
  if(_tempDocuments[key])_tempDocuments[key].splice(index,1);
  renderFilePreview(previewId,key);
}

function clearTempFiles(){
  _tempImages={};
  _tempDocuments={};
}

/* ==================== 路由系统 ==================== */
const routes=[];
function route(path,handler){routes.push({path,handler})}

function getCurrentHash(){
  const h=location.hash.slice(1);
  return h||'/dashboard';
}

function matchRoute(path){
  for(const r of routes){
    const paramNames=[];
    const regexStr=r.path.replace(/:([^/]+)/g,(_,p)=>{paramNames.push(p);return'([^/]+)'});
    const regex=new RegExp('^'+regexStr+'$');
    const match=path.match(regex);
    if(match){
      const params={};
      paramNames.forEach((n,i)=>params[n]=decodeURIComponent(match[i+1]));
      return{handler:r.handler,params};
    }
  }
  return null;
}

function navigate(path){
  const normalizedPath=path.startsWith('/')?path:'/'+path;
  const target='#'+normalizedPath;
  const current='#'+getCurrentHash();
  if(target===current){
    handleRoute();
  }else{
    location.hash=target;
  }
}

async function handleRoute(){
  const path=getCurrentHash();
  const matched=matchRoute(path);
  const content=document.getElementById('contentInner');
  content.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:8px">加载中...</p></div>';
  try{
    if(matched){
      await matched.handler(matched.params||{});
      // If handler used showModal and didn't update content, clear loading state
      const loadingEl=content.querySelector(':scope>div.loading');
      if(loadingEl)content.innerHTML='';
    }else{
      content.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">页面不存在</div></div>';
    }
  }catch(err){
    console.error('Route error:',err);
    content.innerHTML='<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败: '+escapeHtml(err.message)+'</div></div>';
  }
  updateSidebarActive(path);
  updateHeaderSub(path);
}

window.addEventListener('hashchange',handleRoute);

      <input class="form-input" id="studentSearch" placeholder="搜索学生姓名/手机号..." data-action="search-students">
      <select class="form-select" id="studentClassFilter" style="width:140px" data-action="filter-students">

        ${classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary" data-action="nav" data-path="/students/new">新增</button>
    </div>
    <div class="card">
      <div id="studentList"></div>
    </div>
  `;

  const renderList=(list)=>{
    const el=document.getElementById('studentList');
    if(list.length===0){
      el.innerHTML='<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-text">暂无学生数据</div></div>';
      return;
    }
    el.innerHTML=list.map(s=>`
      <div class="list-item" data-action="nav" data-path="/students/${s.id}">
        <div class="avatar" style="background:${avatarColor(s.name||'?')}">${getInitials(s.name||'?')}</div>
        <div class="list-item-info">
          <div class="list-item-title">${escapeHtml(s.name||'')}</div>
          <div class="list-item-desc">${escapeHtml(classMap[s.classId]||'未分班')} · ${escapeHtml(s.phone||'无手机')}</div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-sm btn-outline" data-action="edit-student" data-id="${s.id}">编辑</button>
          <button class="btn btn-sm btn-danger" data-action="del-student" data-id="${s.id}">删除</button>
        </div>
      </div>
    `).join('');
  };

  let filtered=students;
  renderList(filtered);

  const searchInput=document.getElementById('studentSearch');
  const classFilter=document.getElementById('studentClassFilter');
  const doFilter=()=>{
    const q=searchInput.value.trim().toLowerCase();
    const cls=classFilter.value;
    filtered=students.filter(s=>{
      const matchQ=!q||(s.name||'').toLowerCase().includes(q)||(s.phone||'').includes(q);
      const matchC=!cls||s.classId===cls;
      return matchQ&&matchC;
    });
    renderList(filtered);
  };
  searchInput.addEventListener('input',doFilter);
  classFilter.addEventListener('change',doFilter);
}

async function renderStudyTrends(el){

        </div>
      `}

  /* ---- Tab 渲染分发 ---- */
  const renderTab=(tab)=>{
    document.querySelectorAll('[data-att-tab]').forEach(el=>el.classList.toggle('active',el.dataset.attTab===tab));
    const el=document.getElementById('attTabContent');
    if(tab==='checkin'){
      el.innerHTML=renderCheckinTab();
      const classSel=document.getElementById('attClass');
      const studentListEl=document.getElementById('attStudentList');
      const attActions=document.getElementById('attActions');
      const dateInput=document.getElementById('attDate');

      async function renderAttStudents(){
        const classId=classSel.value;
        if(!classId){studentListEl.innerHTML='';attActions.style.display='none';return}
        const students=await dbQuery('students','classId',classId);
        const date=dateInput.value;
        const checkedIn=await dbQuery('attendance','date',date);
        const checkedMap={};
        checkedIn.forEach(r=>{if(r.type==='checked-in'&&r.classId===classId)checkedMap[r.studentId]=r});
        if(students.length===0){
          studentListEl.innerHTML='<div class="empty-state"><div class="empty-state-text">该班级暂无学生</div></div>';
          attActions.style.display='block';
          return;
        }
        studentListEl.innerHTML=students.map(s=>{
          const rec=checkedMap[s.id];
          const checked=!!rec;
          return `
            <div class="list-item" style="padding:8px 0">
              <div class="avatar avatar-sm" style="background:${avatarColor(s.name||'?')}">${getInitials(s.name||'?')}</div>
              <div class="list-item-info">
                <div class="list-item-title">${escapeHtml(s.name)}</div>
                <div class="list-item-desc">${checked?'<span class="badge badge-success">已签到</span> '+fmtDateTime(rec.checkinTime):'未签到'}</div>
              </div>
              ${checked?
                '<span class="badge badge-success">已签到</span>':
                `<button class="btn btn-sm btn-primary" data-action="check-in" data-student-id="${s.id}" data-student-name="${escapeHtml(s.name)}">签到</button>`
              }
            </div>
          `;
        }).join('');
        attActions.style.display='block';
      }

      classSel.addEventListener('change',renderAttStudents);
      dateInput.addEventListener('change',renderAttStudents);
    }else if(tab==='leave'){
      el.innerHTML=renderLeaveTab();
    }else if(tab==='schedule'){
      el.innerHTML=renderScheduleTab();
    }else if(tab==='history'){
      el.innerHTML=renderHistoryTab();
      const dateInput=document.getElementById('histDate');
      const chipEl=document.getElementById('histChips');
      const byDateEl=document.getElementById('histByDate');
      const studentSel=document.getElementById('histStudent');
      const byStudentEl=document.getElementById('histByStudent');
      const fmtClock=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
      const leaveTypeName=t=>t==='sick'?'病假':t==='personal'?'事假':'其他';
      const recSortKey=r=>r.checkinTime||r.createdAt||r.date||'';

      /* 有考勤记录的日期快捷 chips */
      function renderChips(){
        const dates=[...new Set(allAttendance.filter(r=>r.date).map(r=>r.date))].sort().reverse();
        if(dates.length===0){chipEl.innerHTML='<div style="font-size:12px;color:var(--text-tertiary);padding:2px 0 6px">暂无历史考勤记录</div>';return}
        chipEl.innerHTML=dates.map(d=>`<button type="button" class="hist-chip${d===dateInput.value?' active':''}" data-d="${d}">${d.slice(5).replace('-','/')}</button>`).join('');
        chipEl.querySelectorAll('.hist-chip').forEach(b=>{
          b.addEventListener('click',()=>{
            dateInput.value=b.dataset.d;
            attHistoryDate=dateInput.value;
            renderChips();
            renderByDate();
          });
        });
      }

      /* 按日期渲染当日考勤 */
      function renderByDate(){
        const date=dateInput.value;
        if(!date){byDateEl.innerHTML='';renderChips();return}
        renderChips();
        const recs=allAttendance.filter(r=>r.date===date);
        if(recs.length===0){
          byDateEl.innerHTML='<div class="empty-state" style="padding:24px 12px"><div class="empty-state-icon">📅</div><div class="empty-state-text">该日期暂无考勤记录</div></div>';
          return;
        }
        const checked=recs.filter(r=>r.type==='checked-in').slice().sort((a,b)=>(a.checkinTime||'').localeCompare(b.checkinTime||''));
        const leaves=recs.filter(r=>r.type==='leave');
        const groups={};
        checked.forEach(r=>{(groups[r.classId]||(groups[r.classId]=[])).push(r)});
        let html=`<div class="hist-stats">
          <div class="hist-stat"><div class="hist-stat-num">${checked.length}</div><div class="hist-stat-label">出勤</div></div>
          <div class="hist-stat"><div class="hist-stat-num">${leaves.length}</div><div class="hist-stat-label">请假</div></div>
          <div class="hist-stat"><div class="hist-stat-num">${Object.keys(groups).length}</div><div class="hist-stat-label">涉及班级</div></div>
        </div>`;
        Object.keys(groups).forEach(cid=>{
          const cname=cid&&classMap[cid]?classMap[cid]:'未分班';
          html+=`<div class="hist-class-title"><span>${escapeHtml(cname)}</span><span style="font-weight:500;font-size:12px;color:var(--text-secondary)">${groups[cid].length} 人出勤</span></div>`;
          html+=groups[cid].map(r=>`
            <div class="list-item" style="padding:9px 0">
              <div class="avatar avatar-sm" style="background:${avatarColor(r.studentName||'?')}">${getInitials(r.studentName||'?')}</div>
              <div class="list-item-info">
                <div class="list-item-title">${escapeHtml(r.studentName||'')}</div>
                <div class="list-item-desc"><span class="badge badge-success">出勤</span> ${fmtClock(r.checkinTime)} 签到</div>
              </div>
              <button class="btn btn-sm btn-danger" data-action="del-attendance" data-id="${r.id}">删除</button>
            </div>`).join('');
        });
        if(leaves.length>0){
          html+=`<div class="hist-class-title"><span>当日请假</span><span style="font-weight:500;font-size:12px;color:var(--text-secondary)">${leaves.length} 人</span></div>`;
          html+=leaves.map(r=>`
            <div class="list-item" style="padding:9px 0">
              <div class="avatar avatar-sm" style="background:${avatarColor(r.studentName||'?')}">${getInitials(r.studentName||'?')}</div>
              <div class="list-item-info">
                <div class="list-item-title">${escapeHtml(r.studentName||'')}</div>
                <div class="list-item-desc"><span class="badge badge-warning">${leaveTypeName(r.leaveType)}</span>${r.remark?' '+escapeHtml(r.remark):''}</div>
              </div>
              <button class="btn btn-sm btn-danger" data-action="del-attendance" data-id="${r.id}">删除</button>
            </div>`).join('');
        }
        byDateEl.innerHTML=html;
      }

      /* 按学生渲染历史时间线 */
      function renderByStudent(){
        const sid=studentSel.value;
        if(!sid){byStudentEl.innerHTML='';return}
        const recs=allAttendance.filter(r=>r.studentId===sid);
        if(recs.length===0){
          byStudentEl.innerHTML='<div class="empty-state" style="padding:24px 12px"><div class="empty-state-icon">👤</div><div class="empty-state-text">该学生暂无考勤记录</div></div>';
          return;
        }
        const nCheck=recs.filter(r=>r.type==='checked-in').length;
        const nLeave=recs.filter(r=>r.type==='leave').length;
        const nRs=recs.filter(r=>r.type==='reschedule').length;
        const ordered=recs.slice().sort((a,b)=>recSortKey(b).localeCompare(recSortKey(a)));
        let html=`<div class="hist-stats">
          <div class="hist-stat"><div class="hist-stat-num">${nCheck}</div><div class="hist-stat-label">出勤(次)</div></div>
          <div class="hist-stat"><div class="hist-stat-num">${nLeave}</div><div class="hist-stat-label">请假(次)</div></div>
          <div class="hist-stat"><div class="hist-stat-num">${nRs}</div><div class="hist-stat-label">调课(次)</div></div>
        </div>`;
        html+=ordered.map(r=>{
          let badge,desc;
          if(r.type==='checked-in'){
            badge='<span class="badge badge-success">出勤</span>';
            desc=`${fmtDate(r.date)} ${fmtClock(r.checkinTime)} 签到`;
          }else if(r.type==='leave'){
            badge=`<span class="badge badge-warning">${leaveTypeName(r.leaveType)}</span>`;
            desc=`${fmtDate(r.date)}${r.remark?' · '+escapeHtml(r.remark):''}`;
          }else{
            badge='<span class="badge badge-info">调课</span>';
            desc=`${fmtDate(r.originalDate)} → ${fmtDate(r.newDate)}${r.reason?' · '+escapeHtml(r.reason):''}`;
          }
          return `
            <div class="list-item" style="padding:9px 0">
              <div class="avatar avatar-sm" style="background:${avatarColor(r.studentName||'?')}">${getInitials(r.studentName||'?')}</div>
              <div class="list-item-info">
                <div class="list-item-title">${badge}</div>
                <div class="list-item-desc">${desc}</div>
              </div>
              <button class="btn btn-sm btn-danger" data-action="del-attendance" data-id="${r.id}">删除</button>
            </div>`;
        }).join('');
        byStudentEl.innerHTML=html;
      }

      if(attHistorySid)studentSel.value=attHistorySid;
      dateInput.addEventListener('change',()=>{
        attHistoryDate=dateInput.value;
        renderChips();
        renderByDate();
      });
      studentSel.addEventListener('change',()=>{
        attHistorySid=studentSel.value;
        renderByStudent();
      });
      renderByDate();
      renderByStudent();
    }
  };

  document.querySelectorAll('[data-att-tab]').forEach(el=>{
    el.addEventListener('click',()=>{
      attActiveTab=el.dataset.attTab;
      renderTab(attActiveTab);
    });
  });
  renderTab(attActiveTab);
});

route('/points',async()=>{

  content.innerHTML=`

        <div style="margin-bottom:12px"><button class="btn btn-primary" data-action="add-points">新增积分</button></div>
        <div class="card"><div>${pointsRecords.length===0?'<div class="empty-state"><div class="empty-state-text">暂无积分记录</div></div>':pointsRecords.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-title">${escapeHtml(p.studentName||'')} <span class="badge badge-${p.type==='add'?'success':'danger'}">${p.type==='add'?'+':'-'}${p.amount}</span></div>

          </div>
        `).join('')}</div></div>
      `;
    }else if(tab==='ranking'){
      const sorted=Object.entries(pointsByStudent).sort((a,b)=>b[1].total-a[1].total);
      el.innerHTML=`<div class="card"><div>${sorted.length===0?'<div class="empty-state"><div class="empty-state-text">暂无数据</div></div>':sorted.map(([id,data],i)=>`
        <div class="list-item">
          <div style="width:24px;text-align:center;font-weight:700;color:${i<3?'var(--warning)':'var(--text-tertiary)'}">${i+1}</div>
          <div class="list-item-info"><div class="list-item-title">${escapeHtml(data.name)}</div></div>
          <div class="points-display" style="font-size:18px">${data.total}</div>
        </div>
      `).join('')}</div></div>`;
    }else if(tab==='rewards'){
      el.innerHTML=`
        <div style="margin-bottom:12px"><button class="btn btn-primary" data-action="add-reward">新增奖励</button></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px">
          ${rewards.length===0?'<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">暂无奖励</div></div>':rewards.map(r=>`
            <div class="reward-card">
              <div class="reward-icon">${r.icon||'🎁'}</div>
              <div class="reward-name">${escapeHtml(r.name)}</div>
              <div class="reward-cost">${r.cost}积分</div>
              <button class="btn btn-sm btn-primary" data-action="exchange-reward" data-id="${r.id}" data-name="${escapeHtml(r.name)}" data-cost="${r.cost}">兑换</button>
              <button class="btn btn-sm btn-danger" data-action="del-reward" data-id="${r.id}" style="margin-top:4px">删除</button>
            </div>
          `).join('')}
        </div>
      `;
    }
  };

  document.querySelectorAll('[data-points-tab]').forEach(el=>{
    el.addEventListener('click',()=>renderTab(el.dataset.pointsTab));
  });
  renderTab('records');
});

/* ==================== 全局事件处理 ==================== */
document.addEventListener('click',async e=>{
  const target=e.target.closest('[data-action]');
  if(!target)return;
  const action=target.dataset.action;

  switch(action){
    case 'close-modal':
      closeModal();
      break;

    case 'toggle-sidebar':{
      const sb=document.getElementById('sidebar');
      if(sb.classList.contains('open'))closeDrawer();else openDrawer();
      break;
    }

    case 'go-settings':
      navigate('/settings');
      break;

    case 'nav':{
      e.stopPropagation();
      const path=target.dataset.path;
      if(path)navigate(path);
      break;
    }

    case 'edit-student':{
      e.stopPropagation();
      const id=target.dataset.id;
      await renderStudentForm(id);
      break;
    }

    case 'del-student':{
      e.stopPropagation();
      const id=target.dataset.id;
      confirmDialog('删除学生','确定要删除该学生吗？删除后不可恢复。',async()=>{
        await dbDel('students',id);
        toast('删除成功');
        navigate('/students');
      });
      break;
    }

    case 'edit-class':{
      e.stopPropagation();
      const id=target.dataset.id;
      await renderClassForm(id);
      break;
    }

    case 'del-class':{
      e.stopPropagation();
      const id=target.dataset.id;
      confirmDialog('删除班级','确定要删除该班级吗？',async()=>{
        await dbDel('classes',id);
        toast('删除成功');
        navigate('/classes');
      });
      break;
    }

    case 'del-comm':{
      e.stopPropagation();
      const id=target.dataset.id;
      confirmDialog('删除记录','确定要删除该沟通记录吗？',async()=>{
        await dbDel('parent_communications',id);
        toast('删除成功');
        navigate('/parent-comm');
      });
      break;
    }

    case 'view-comm':{
      e.stopPropagation();
      const id=target.dataset.id;
      const comm=await dbGet('parent_communications',id);
      if(!comm)return;
      let body=`<div style="margin-bottom:12px"><strong>学生：</strong>${escapeHtml(comm.studentName||'')}</div>`;
      body+=`<div style="margin-bottom:12px"><strong>方式：</strong>${comm.type==='phone'?'电话':comm.type==='wechat'?'微信':'面谈'}</div>`;
      body+=`<div style="margin-bottom:12px"><strong>日期：</strong>${fmtDate(comm.date)}</div>`;
      body+=`<div style="margin-bottom:12px"><strong>内容：</strong><br>${escapeHtml(comm.content||'')}</div>`;
      if(comm.images&&comm.images.length){
        body+=`<div style="margin-bottom:8px"><strong>图片：</strong></div><div class="file-preview">${comm.images.map(img=>`<img class="image-thumb" src="${img.data}">`).join('')}</div>`;
      }
      if(comm.documents&&comm.documents.length){
        body+=`<div style="margin-top:8px;margin-bottom:8px"><strong>文档：</strong></div>${comm.documents.map(d=>`<div class="file-tag">📄 ${escapeHtml(d.name)}</div>`).join(' ')}`;
      }
      showModal('沟通记录详情',body,`<button class="btn btn-outline" data-action="close-modal">关闭</button>`);
      break;
    }

    case 'add-study-record':{
      const students=await dbGetAll('students');
      const body=`
        <div class="form-group">
          <label class="form-label">学生 <span class="req">*</span></label>
          <select class="form-select" id="srStudent">
            <option value="">请选择</option>
            ${students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">科目</label>
            <input class="form-input" id="srSubject" placeholder="如：数学">
          </div>
          <div class="form-group">
            <label class="form-label">分数（可选）</label>
            <input class="form-input" type="number" id="srScore" placeholder="0-100">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">日期</label>
          <input class="form-input" type="date" id="srDate" value="${todayStr()}">
        </div>
        <div class="form-group">
          <label class="form-label">记录内容</label>
          <textarea class="form-textarea" id="srContent" placeholder="学习情况记录..."></textarea>
        </div>
      `;
      showModal('新增学情记录',body,`<button class="btn btn-outline" data-action="close-modal">取消</button><button class="btn btn-primary" id="saveSrBtn">保存</button>`);
      document.getElementById('saveSrBtn').addEventListener('click',async()=>{
        const studentId=document.getElementById('srStudent').value;
        if(!studentId){toast('请选择学生');return}
        const student=await dbGet('students',studentId);
        const scoreVal=document.getElementById('srScore').value;
        await dbAdd('study_records',{
          id:genId(),
          studentId,
          studentName:student?.name||'',
          subject:document.getElementById('srSubject').value.trim(),

        </div>
      `;
      showModal('兑换奖励',body,`<button class="btn btn-outline" data-action="close-modal">取消</button><button class="btn btn-primary" id="confirmExBtn">确认兑换</button>`);
      document.getElementById('confirmExBtn').addEventListener('click',async()=>{
        const studentId=document.getElementById('exStudent').value;
        if(!studentId){toast('请选择学生');return}
        const student=await dbGet('students',studentId);
        const points=await dbQuery('points_records','studentId',studentId);
        const total=points.reduce((sum,p)=>sum+(p.type==='add'?p.amount:-p.amount),0);
        if(total<cost){toast('积分不足！当前积分：'+total);return}
        await dbAdd('points_records',{
          id:genId(),
          studentId,
          studentName:student?.name||'',
          type:'deduct',
          amount:cost,
          reason:'兑换：'+rewardName,
          date:todayStr(),
          createdAt:new Date().toISOString()
        });
        await dbAdd('exchange_records',{
          id:genId(),
          studentId,
          studentName:student?.name||'',
          rewardId,
          rewardName,
          cost,
          date:todayStr(),
          createdAt:new Date().toISOString()
        });
        closeModal();
        toast('兑换成功！');
        navigate('/points');
      });
      break;
    }

    case 'add-fee':{
      const classes=await dbGetAll('classes');
      const body=`
        <div class="form-group">
          <label class="form-label">收费名称 <span class="req">*</span></label>
          <input class="form-input" id="feeName" placeholder="如：秋季学费">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">金额 <span class="req">*</span></label>
            <input class="form-input" type="number" id="feeAmount" value="0" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">截止日期</label>
            <input class="form-input" type="date" id="feeDueDate" value="${todayStr()}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">关联班级</label>
          <select class="form-select" id="feeClass">
            <option value="">全部班级</option>
            ${classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="feeRemark" placeholder="收费说明..."></textarea>
        </div>
      `;
      showModal('新增收费',body,`<button class="btn btn-outline" data-action="close-modal">取消</button><button class="btn btn-primary" id="saveFeeBtn">保存</button>`);
      document.getElementById('saveFeeBtn').addEventListener('click',async()=>{
        const name=document.getElementById('feeName').value.trim();
        if(!name){toast('请输入收费名称');return}
        const amount=Number(document.getElementById('feeAmount').value);
        if(!amount||amount<=0){toast('请输入有效金额');return}
        const classId=document.getElementById('feeClass').value;
        const feeId=genId();
        await dbAdd('fees',{
          id:feeId,
          name,
          amount,
          dueDate:document.getElementById('feeDueDate').value,
          classId,
          remark:document.getElementById('feeRemark').value.trim(),
          createdAt:new Date().toISOString()
        });
        const students=classId?await dbQuery('students','classId',classId):await dbGetAll('students');
        for(const s of students){
          await dbAdd('payment_records',{
            id:genId(),
            feeId,
            feeName:name,
            studentId:s.id,
            studentName:s.name,
            amount,
            status:'unpaid',
            createdAt:new Date().toISOString()
          });
        }
        closeModal();
        toast('保存成功');
        navigate('/fees');
      });
      break;
    }

    case 'view-fee':{
      e.stopPropagation();
      const id=target.dataset.id;
      const fee=await dbGet('fees',id);
      if(!fee)return;
      const payments=await dbQuery('payment_records','feeId',id);
      let body=`<div style="margin-bottom:12px"><strong>金额：</strong>¥${fee.amount}</div>`;
      body+=`<div style="margin-bottom:12px"><strong>截止：</strong>${fmtDate(fee.dueDate)}</div>`;
      if(fee.remark)body+=`<div style="margin-bottom:12px"><strong>备注：</strong>${escapeHtml(fee.remark)}</div>`;
      body+=`<div style="margin-top:16px;border-top:1px solid var(--border-light);padding-top:12px"><strong>缴费记录（${payments.length}）：</strong></div>`;
      body+=payments.map(p=>`
        <div class="list-item">
          <div class="list-item-info">
            <div class="list-item-title">${escapeHtml(p.studentName||'')}</div>
            <div class="list-item-desc"><span class="badge badge-${p.status==='paid'?'success':'danger'}">${p.status==='paid'?'已缴':'待缴'}</span></div>
          </div>
          ${p.status!=='paid'?`<button class="btn btn-sm btn-success" data-action="mark-paid" data-id="${p.id}">标记已缴</button>`:''}
        </div>
      `).join('');
      showModal('收费详情',body,`<button class="btn btn-outline" data-action="close-modal">关闭</button>`);
      break;
    }

    case 'mark-paid':{
      e.stopPropagation();
      const id=target.dataset.id;
      const payment=await dbGet('payment_records',id);
      if(payment){
        payment.status='paid';
        payment.paidAt=new Date().toISOString();
        await dbPut('payment_records',payment);
        toast('已标记缴费');
        closeModal();
        const feeEl=document.querySelector('[data-action="view-fee"]');
        if(feeEl)feeEl.click();
      }
      break;
    }

    case 'del-fee':{
      e.stopPropagation();
      const id=target.dataset.id;
      confirmDialog('删除收费','确定删除该收费项目及相关缴费记录？',async()=>{
        await dbDel('fees',id);
        const payments=await dbQuery('payment_records','feeId',id);
        for(const p of payments)await dbDel('payment_records',p.id);
        toast('删除成功');
        navigate('/fees');
      });
      break;
    }

    case 'export-data':{
      const data={};
      for(const storeName of Object.keys(STORE_DEFS)){
        data[storeName]=await dbGetAll(storeName);
      }
      const json=JSON.stringify(data,null,2);
      const blob=new Blob([json],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='mia_edu_backup_'+todayStr()+'.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('导出成功');
      break;
    }

    case 'import-data':{
      document.getElementById('importFileInput').click();
      break;
    }
  }
});

// Handle import file change
document.addEventListener('change',async e=>{
  if(e.target.id==='importFileInput'){
    const file=e.target.files[0];
    if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      confirmDialog('导入数据','确定要导入数据吗？这将覆盖现有同ID记录。',async()=>{
        for(const [storeName,records] of Object.entries(data)){
          if(!STORE_DEFS[storeName])continue;
          for(const record of records){
            await dbPut(storeName,record);
          }
        }
        toast('导入成功');
        navigate('/settings');
      });
    }catch(err){
      toast('导入失败：'+err.message);
    }
    e.target.value='';
  }
});

/* ==================== 初始化 ==================== */
async function init(){
  renderSidebar();
  document.getElementById('sidebarOverlay').addEventListener('click',closeDrawer);
  await openDB();

  // Add some default rewards if empty
  const rewardCount=await dbCount('rewards');
  if(rewardCount===0){
    const defaultRewards=[
      {id:genId(),name:'小贴纸',icon:'⭐',cost:5,active:true,createdAt:new Date().toISOString()},
      {id:genId(),name:'小文具',icon:'🖊️',cost:15,active:true,createdAt:new Date().toISOString()},
      {id:genId(),name:'课外书',icon:'📖',cost:50,active:true,createdAt:new Date().toISOString()},
      {id:genId(),name:'免作业一次',icon:'🎫',cost:30,active:true,createdAt:new Date().toISOString()}
    ];
    for(const r of defaultRewards)await dbAdd('rewards',r);
  }

  handleRoute();
}

init();
</script>
